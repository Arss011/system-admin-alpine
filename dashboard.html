<!DOCTYPE html>
<html lang="id" x-data="portalApp()" x-init="initPortal()" hx-boost="true">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Portal System Administration</title>

        <!-- Bootstrap & Icons -->
        <link rel="stylesheet" href="./assets/css/bootstrap.min.css"/>
        <link rel="stylesheet" href="./assets/css/bootstrap-icons.css"/>

        <!-- HTMX & Alpine -->
        <script src="./assets/js/htmx.min.js"></script>
        <script src="./assets/js/alpine-morph.js"></script>
        <script defer src="./assets/js/alpinejs@3.x.x/dist/cdn.min.js"></script>

        <!-- App Assets -->
        <script src="./assets/js/app.js"></script>
        <link rel="stylesheet" href="./assets/css/style.css" />
        <script src="./assets/js/sweetalert2@11.js"></script>
    </head>

    <body class="bg-light">
        <!-- HEADER -->
        <header class="dashboard-header d-flex justify-content-between align-items-center p-3 bg-white border-bottom shadow-sm">
            <!-- Left: User info -->
            <div class="d-flex align-items-center user-info">
                <img
                    src="./assets/img/users.png"
                    alt="User Avatar"
                    class="rounded-circle me-2"
                    width="48"
                    height="48"
                />
                <div>
                    <h6 class="mb-0 fw-semibold" x-text="username"></h6>
                    <small class="text-muted" x-text="userEmail"></small>
                </div>
            </div>

            <!-- Middle: Title -->
            <div class="text-center d-none d-md-block">
                <h5 class="fw-bold mb-0">Dashboard</h5>
            </div>

            <!-- Right: Set Roles + Logout -->
            <div class="d-flex align-items-center gap-2">
                <button
                    class="btn btn-outline-primary btn-sm"
                    hx-get="./partials/set-roles.html"
                    hx-target="#main-content"
                    hx-swap="innerHTML"
                >
                    <i class="bi bi-people-fill me-1"></i> Set Roles
                </button>

                <button
                    class="btn btn-outline-danger btn-sm fw-semibold"
                    @click="logout"
                >
                    <i class="bi bi-box-arrow-right me-1"></i> Logout
                </button>
            </div>
        </header>

        <!-- MAIN CONTENT -->
        <main id="main-content" class="container py-5">
            <!-- <div class="row g-4 justify-content-center">
                <template x-for="card in cards" :key="card.id">
                    <div class="col-6 col-md-3 col-lg-2" x-show="canView(card.role)">
                        <div
                            class="card module-card text-center p-3 shadow-sm h-100"
                            :hx-get="'./partials/card-' + card.module + '.html'"
                            hx-trigger="click"
                            hx-target="#main-content"
                            hx-swap="innerHTML"
                            style="cursor: pointer"
                        >
                            <i class="bi module-icon mb-2 fs-2" :class="card.icon"></i>
                            <div class="module-title fw-semibold" x-text="card.title"></div>
                        </div>
                    </div>
                </template>
            </div> -->

            <!-- Default fallback -->
            <div id="default-message" class="text-center text-muted mt-5" x-show="cards.length === 0">
                <i class="bi bi-grid fs-1 d-block mb-3"></i>
                <p>Pilih salah satu modul di atas untuk memulai.</p>
            </div>
        </main>

        <!-- Bootstrap JS -->
        <script src="./assets/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
