<!DOCTYPE html>
<html lang="id" x-data="portalApp()" x-init="initPortal()" hx-boost="true">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal System Administration</title>

    <!-- Bootstrap Icons (local) -->
    <link rel="stylesheet" href="./assets/css/bootstrap-icons.css" />

    <!-- Bootstrap 5.3 CDN (only) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="./assets/css/style.css" />

    <!-- HTMX -->
    <script src="./assets/js/htmx.min.js"></script>

    <!-- AlpineJS Dependencies -->
    <script src="./assets/js/alpine-morph.js"></script>

    <!-- SweetAlert2 (HARUS sebelum app.js) -->
    <script src="./assets/js/sweetalert2@11.js"></script>

    <!-- Runtime Environment Config -->
    <script src="./assets/js/config.js"></script>

    <!-- App (Define Alpine components before Alpine init) -->
    <script src="./assets/js/app.js"></script>

    <!-- AlpineJS Core (defered execution) -->
    <script defer src="./assets/js/alpinejs@3.x.x/dist/cdn.min.js"></script>
  </head>

  <body x-cloak>
    <!-- MODERN NAVIGATION HEADER -->
    <header class="modern-header" x-data="navigationHeader()" x-init="initNavigation()">
      <!-- Top Navigation Bar -->
      <nav class="top-nav">
        <div class="nav-left">
          <!-- Logo & Brand -->
          <div class="brand-section">
            <div class="logo-container">
              <i class="bi bi-grid-3x3-gap-fill brand-icon"></i>
            </div>
            <!-- <div class="brand-text">
              <h1 class="brand-title">System Admin</h1>
              <span class="brand-subtitle">Portal Management</span>
            </div> -->
          </div>

          <!-- Main Navigation -->
          <div class="nav-menu" :class="{'mobile-open': mobileMenuOpen}">
            <a href="#"
               class="nav-item active"
               @click="setActiveNav($event, 'dashboard')">
              <i class="bi bi-speedometer2"></i>
              <span>Set Role</span>
            </a>

            <!-- Incentive Menu with Bootstrap Dropdown -->
            <div class="dropdown nav-dropdown">
              <button class="nav-item dropdown-toggle"
                      type="button"
                      id="incentiveDropdown"
                      data-bs-toggle="dropdown"
                      aria-expanded="false">
                <i class="bi bi-gift"></i>
                <span>Incentive</span>
                <i class="bi bi-chevron-down dropdown-arrow-sm"></i>
              </button>
              <ul class="dropdown-menu" aria-labelledby="incentiveDropdown">
                <li>
                  <button class="dropdown-item"
                          hx-get="./partials/sembako.html"
                          hx-target="#main-content"
                          hx-swap="innerHTML"
                          onclick="window.navigationHeaderInstance.setActiveNav(event, 'sembako')">
                    <i class="bi bi-box-seam"></i>
                    Sembako
                  </button>
                </li>
                <li>
                  <a href="#" class="dropdown-item" onclick="event.preventDefault()">
                    <i class="bi bi-star"></i>
                    Other Incentives
                  </a>
                </li>
              </ul>
            </div>

            <a href="#"
               class="nav-item"
               @click="setActiveNav($event, 'settings')">
              <i class="bi bi-gear"></i>
              <span>Settings</span>
            </a>
            <a href="#"
               class="nav-item"
               @click="setActiveNav($event, 'reports')">
              <i class="bi bi-graph-up"></i>
              <span>Reports</span>
            </a>
          </div>
        </div>

        <div class="nav-right">
          <!-- Search Bar -->
          <!-- <div class="search-container" x-show="!mobileMenuOpen">
            <div class="search-input-wrapper">
              <i class="bi bi-search search-icon"></i>

                     class="search-input"

                     @focus="searchFocused = true"

              <div class="search-suggestions" x-show="searchFocused && searchQuery">
                <div class="suggestion-item">Search in users...</div>
                <div class="suggestion-item">Search in settings...</div>
              </div>
            </div>
          </div> -->

          <!-- Notifications -->
          <!-- <div class="nav-item-wrapper" x-data="notificationDropdown()">
            <button class="nav-icon-btn notification-btn"
                    @click="toggleNotifications"
                    :class="{'has-notifications': unreadCount > 0}">
              <i class="bi bi-bell"></i>
              <span class="notification-badge" x-show="unreadCount > 0" x-text="unreadCount"></span>
            </button>

            <div class="dropdown-panel notifications-dropdown" x-show="isOpen" x-transition>
              <div class="dropdown-header">
                <h6>Notifications</h6>
                <button class="mark-all-read" @click="markAllRead">Mark all read</button>
              </div>
              <div class="notifications-list">
                <template x-for="notification in notifications" :key="notification.id">
                  <div class="notification-item" :class="{'unread': !notification.read}">
                    <div class="notification-icon">

                      <small x-text="notification.time"></small>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </div> -->

          <!-- User Profile Dropdown -->
          <div class="dropdown nav-item-wrapper">
            <button class="user-profile-btn dropdown-toggle"
                    type="button"
                    id="userProfileDropdown"
                    data-bs-toggle="dropdown"
                    aria-expanded="false">
              <img src="./assets/img/users.png" alt="User Avatar" class="user-avatar">
              <div class="user-info-text">
                <div class="user-name" x-text="username"></div>
                <div class="user-role" x-text="userRole"></div>
              </div>
              <i class="bi bi-chevron-down dropdown-arrow"></i>
            </button>

            <ul class="dropdown-menu profile-dropdown" aria-labelledby="userProfileDropdown">
              <li>
                <div class="profile-header dropdown-header">
                  <img src="./assets/img/users.png" alt="User Avatar" class="profile-avatar">
                  <div>
                    <h6 x-text="username"></h6>
                    <p x-text="userEmail"></p>
                  </div>
                </div>
              </li>
              <li><hr class="dropdown-divider"></li>
              <li>
                <button class="dropdown-item"
                        hx-get="./partials/set-roles.html"
                        hx-target="#main-content"
                        hx-swap="innerHTML">
                  <i class="bi bi-people-fill"></i> Set Roles
                </button>
              </li>
              <li>
                <button class="dropdown-item"
                        hx-get="./partials/sembako.html"
                        hx-target="#main-content"
                        hx-swap="innerHTML">
                  <i class="bi bi-people-fill"></i> Sembako
                </button>
              </li>
              <li><hr class="dropdown-divider"></li>
              <li>
                <button class="dropdown-item logout-item" onclick="window.portalAppInstance.logout()">
                  <i class="bi bi-box-arrow-right"></i> Logout
                </button>
              </li>
            </ul>
          </div>

          <!-- Mobile Menu Toggle -->
          <button class="mobile-menu-toggle" @click="mobileMenuOpen = !mobileMenuOpen">
            <span></span>
            <span></span>
            <span></span>
          </button>
        </div>
      </nav>

      <!-- Quick Actions Bar -->
      <div class="quick-actions-bar" x-show="!mobileMenuOpen">
        <div class="quick-actions-left">
          <h2 class="page-title" x-text="currentPageTitle"></h2>
          <nav class="breadcrumb">
            <span class="breadcrumb-item">Home</span>
            <span class="breadcrumb-separator">/</span>
            <span class="breadcrumb-item active" x-text="currentPageTitle"></span>
          </nav>
        </div>
        <div class="quick-actions-right">
          <button class="quick-action-btn" @click="refreshCurrentPage">
            <i class="bi bi-arrow-clockwise"></i> Refresh
          </button>
        </div>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <main id="main-content" class="container py-5">
      <!-- Optional: Spinner while verifying auth -->
      <div
        id="auth-loading"
        class="text-center text-muted mt-5"
        x-show="!username"
      >
        <div class="spinner-border text-primary mb-3" role="status"></div>
        <p>Memverifikasi sesi Anda...</p>
      </div>

      <!-- Default fallback -->
      <!-- x-show="username && !cards?.length" -->
      <div
      id="default-message"
      class="text-center text-muted mt-5"
      >
        <i class="bi bi-grid fs-1 d-block mb-3"></i>
        <p>Portal System Administration.</p>
      </div>
    </main>

    <!-- Bootstrap 5.3 JS Bundle (with Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
