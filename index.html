<!DOCTYPE html>
<html lang="id" x-data="portalApp()" x-init="initPortal()" hx-boost="true">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal System Administration</title>

    <!-- Bootstrap & Icons -->
    <link rel="stylesheet" href="./assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="./assets/css/bootstrap-icons.css" />

    <!-- HTMX -->
    <script src="./assets/js/htmx.min.js"></script>

    <!-- AlpineJS Dependencies -->
    <script src="./assets/js/alpine-morph.js"></script>

    <!-- SweetAlert2 (HARUS sebelum app.js) -->
    <script src="./assets/js/sweetalert2@11.js"></script>

    <!-- Runtime Environment Config -->
    <script src="./assets/js/config.js"></script>

    <!-- App (Define Alpine components before Alpine init) -->
    <script src="./assets/js/app.js" defer></script>

    <!-- AlpineJS Core (defered execution) -->
    <script defer src="./assets/js/alpinejs@3.x.x/dist/cdn.min.js"></script>
  </head>

  <body class="bg-light" x-cloak>
    <!-- HEADER -->
    <header
      class="dashboard-header d-flex justify-content-between align-items-center p-3 bg-white border-bottom shadow-sm"
    >
      <!-- Left: User info -->
      <div class="d-flex align-items-center user-info" x-cloak>
        <img
          src="./assets/img/users.png"
          alt="User Avatar"
          class="rounded-circle me-2"
          width="48"
          height="48"
        />
        <div>
          <h6 class="mb-0 fw-semibold" x-text="username"></h6>
          <small class="text-muted" x-text="userEmail"></small>
        </div>
      </div>

      <!-- Middle: Title -->
      <div class="text-center d-none d-md-block">
        <h5 class="fw-bold mb-0">Dashboard</h5>
      </div>

      <!-- Right: Set Roles + Logout -->
      <div class="d-flex align-items-center gap-2">
        <button
          class="btn btn-outline-primary btn-sm"
          hx-get="./partials/set-roles.html"
          hx-target="#main-content"
          hx-swap="innerHTML"
        >
          <i class="bi bi-people-fill me-1"></i> Set Roles
        </button>

        <button
          class="btn btn-outline-danger btn-sm fw-semibold"
          @click="logout"
        >
          <i class="bi bi-box-arrow-right me-1"></i> Logout
        </button>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <main id="main-content" class="container py-5">
      <!-- Optional: Spinner while verifying auth -->
      <div
        id="auth-loading"
        class="text-center text-muted mt-5"
        x-show="!username"
      >
        <div class="spinner-border text-primary mb-3" role="status"></div>
        <p>Memverifikasi sesi Anda...</p>
      </div>

      <!-- Default fallback -->
      <!-- x-show="username && !cards?.length" -->
      <div
      id="default-message"
      class="text-center text-muted mt-5"
      >
        <i class="bi bi-grid fs-1 d-block mb-3"></i>
        <p>Portal System Administration.</p>
      </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="./assets/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
